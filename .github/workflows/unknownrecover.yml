```yaml
name: Unknown Movie Recovery

on:
  workflow_dispatch:

concurrency:
  group: unknownrecover
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Create Directories
        run: |
          mkdir -p data
          mkdir -p logs

      - name: Check Unknown File
        run: |
          if [ ! -f data/unknown.json ]; then
            echo "data/unknown.json not found."
            echo "Nothing to recover."
            exit 0
          fi

          echo "Unknown file found:"
          ls -lh data/unknown.json

          echo "Entries:"
          wc -l data/unknown.json

      - name: Run Unknown Recovery
        run: |
          python unknownrecover.py

      - name: Show Stats
        run: |
          echo "======================================"
          echo "DATA FILES"
          echo "======================================"
          find data -type f | sort

          echo
          echo "======================================"
          echo "UNKNOWN REMAINING"
          echo "======================================"

          if [ -f data/unknown.json ]; then
            wc -l data/unknown.json
          else
            echo "0"
          fi

          echo
          echo "======================================"
          echo "ALREADY FETCHED"
          echo "======================================"

          if [ -f logs/alreadyfetched.txt ]; then
            wc -l logs/alreadyfetched.txt
          else
            echo "0"
          fi

          echo
          echo "======================================"
          echo "FAILED"
          echo "======================================"

          if [ -f logs/failed.txt ]; then
            wc -l logs/failed.txt
          else
            echo "0"
          fi

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git add logs/

          git diff --cached --quiet && exit 0

          git commit -m "recover unknown movie data"

      - name: Push Changes
        run: |
          git push
```
